<section class="callband{{#if bild}} callband--bild{{/if}}" aria-labelledby="call-title">
      {{#if bild}}<img class="callband-img" src="assets/img/feuer-1400.webp" srcset="assets/img/feuer-800.webp 800w, assets/img/feuer-1400.webp 1400w" sizes="100vw" width="1400" height="2100" loading="lazy" decoding="async" alt="">{{/if}}
      <canvas class="embers" data-embers aria-hidden="true"></canvas>
      <div class="container callband-inner" data-reveal>
        <p class="eyebrow">Hunger?</p>
        <h2 class="callband-title" id="call-title">Ruf einfach an.</h2>
        <a class="callband-number" href="tel:{{telefon.link}}">{{telefon.anzeige}}</a>
        <p class="callband-sub">Bestell vor und hol dein Essen heiß und fertig ab – ganz ohne Wartezeit.<br><span class="callband-status" data-status><span class="status-dot" aria-hidden="true"></span><span data-status-long>{{zeiten.kurz}}</span></span></p>
      </div>
    </section>
