<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>OG-Bild – Ewin's</title>
<!-- Vorlage für assets/img/og-image.jpg (1200×630). Screenshot dieser Seite = Vorschaubild für WhatsApp, Facebook & Co. -->
<link rel="stylesheet" href="../assets/css/style.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body::after { display: none; }
  .og {
    position: relative; width: 1200px; height: 630px; overflow: hidden;
    display: grid; grid-template-columns: 1fr 380px; gap: 40px; align-items: center;
    padding: 0 70px 0 76px; box-sizing: border-box;
    background:
      radial-gradient(520px 420px at 82% 50%, rgba(255, 91, 31, .32), transparent 65%),
      radial-gradient(500px 400px at 0% 100%, rgba(216, 54, 28, .18), transparent 60%),
      #0f0b09;
  }
  .og .logo-mark { width: 50px; height: 50px; }
  .og .logo-name { font-size: 2.1rem; }
  .og .logo-sub { font-size: .72rem; }
  .og h1 {
    margin: 34px 0 30px;
    font-family: var(--font-display); font-weight: 800; font-stretch: 78%;
    font-size: 86px; line-height: .98; letter-spacing: -.03em; color: var(--cream);
  }
  .og h1 span { display: block; white-space: nowrap; }
  .og h1 .accent { font-size: 1.12em; line-height: .8; }
  .og-info { display: flex; gap: 14px; flex-wrap: wrap; }
  .og-pill {
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .7rem 1.1rem; border-radius: 999px;
    font-size: 1.05rem; font-weight: 700; color: var(--cream);
    background: rgba(255, 243, 228, .06); border: 1px solid rgba(255, 243, 228, .14);
  }
  .og-pill--fire { background: var(--fire); color: #1d0f06; border: 0; }
  .og-pill .icon { width: 1.1em; height: 1.1em; }
  .og-arch {
    position: relative; width: 380px; height: 530px; align-self: end; margin-bottom: -10px;
    border-radius: 999px 999px 0 0; overflow: hidden;
    box-shadow: 0 0 0 1px rgba(255, 243, 228, .1), 0 40px 100px -30px rgba(255, 91, 31, .6);
  }
  .og-arch img { width: 100%; height: 100%; object-fit: cover; object-position: 38% 50%; }
  .og-ring { position: absolute; right: 54px; bottom: -26px; width: 412px; height: 572px; border-radius: 999px 999px 0 0; border: 1.5px solid rgba(255, 176, 32, .35); }
  .og-sticker {
    position: absolute; right: 360px; top: 74px; z-index: 2;
    padding: .7rem 1rem; border-radius: 16px; transform: rotate(-6deg);
    background: var(--cream); color: var(--ink-text);
    font-family: var(--font-serif); font-style: italic; font-size: 1.5rem; line-height: 1;
    box-shadow: 0 20px 40px -14px rgba(0, 0, 0, .7);
  }
</style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="g-fire" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0" stop-color="#e8401c"/><stop offset=".55" stop-color="#ff7a1f"/><stop offset="1" stop-color="#ffc23a"/>
      </linearGradient>
    </defs>
    <symbol id="logo-flame" viewBox="0 0 48 48">
      <path fill="url(#g-fire)" d="M24 3c1.6 7.4 8.3 11.5 10.6 19.2 2.6 8.8-2.7 21.8-10.9 21.8-7.6 0-13.7-6.2-12.5-14.4.6-4.4 3.3-7.6 5.6-11 .9 3 2.3 5.2 4.6 6.5C20.2 17.6 21.1 9.4 24 3Z"/>
      <path fill="#fff3e4" d="M24.4 24.6c.9 4 5.5 5.9 5.1 11.1-.3 3.9-2.9 6.3-5.9 6.3-3.6 0-6.1-2.9-5.6-6.6.3-2.4 1.9-4.1 3.2-5.9.5 1.4 1.2 2.5 2.3 3.1-.2-2.9-.1-5.4.9-8Z"/>
    </symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2Z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></g></symbol>
  </svg>
  <div class="og">
    <div>
      <span class="logo">
        <svg class="logo-mark" aria-hidden="true"><use href="#logo-flame"/></svg>
        <span class="logo-text"><span class="logo-name">Ewin's</span><span class="logo-sub">Kebap &amp; Pizza Haus</span></span>
      </span>
      <h1><span>Frisch vom <em class="accent">Spieß.</em></span><span>Heiß aus dem <em class="accent">Ofen.</em></span></h1>
      <div class="og-info">
        <span class="og-pill og-pill--fire"><svg class="icon"><use href="#i-phone"/></svg> 08461 7052857</span>
        <span class="og-pill"><svg class="icon"><use href="#i-pin"/></svg> Ringstraße 22 · Beilngries</span>
      </div>
    </div>
    <div class="og-arch"><img src="../assets/img/hero-spiess-640.webp" alt=""></div>
    <div class="og-ring"></div>
    <div class="og-sticker">Täglich 10:30–20:30</div>
  </div>
</body>
</html>
